pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp index.html app.js style.css public/
    - cp -R src public/src
    - cp -R public_assets public/public_assets
    # Defence in depth against accidentally adding secrets to these directories.
    - find public -type f \( -name '.env' -o -name '.env.*' -o -name 'env' -o -name 'env.txt' -o -name '*.pem' -o -name '*.key' \) -delete
  artifacts:
    paths:
      - public
  only:
    - refactoring
